name: Astro CI - Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Alineado con tu entorno local

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Forzar la instalación de tus librerías críticas de astronomía y APIs
        pip install pytest fastapi httpx uvicorn geocoder skyfield astroquery astroplan pandas numpy

    - name: Run Pytest Suite
      env:
        # Esto le enseña a Pytest la raíz exacta para resolver las importaciones de 'src.'
        PYTHONPATH: ${{ github.workspace }}/Astro
      run: |
          cd Astro
          # Forzamos la ejecución únicamente del archivo principal que valida la lógica core
          pytest test/test_track.py